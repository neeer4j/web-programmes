<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .slider-container {
            position: relative;
            width: 600px;
            height: 400px;
            overflow: hidden; 
            
            
        }
        #slider-image {
            width: 100%;
            height: 100%;
            
        }

        #timer {
            position: absolute;
            top: 15px;
            right: 15px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
          
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <img id="slider-image" src="green.png" alt="Slideshow">
        <div id="timer">Time left: 10</div>
    </div>

    <script>
        const images = [
            "green.png",
            "yellow.png",
            "red.png",
             "yellow.png"
        ];
        let currentIndex = 0;
        const sliderImage = document.getElementById("slider-image");
        const timer = document.getElementById("timer");
        const durationInSeconds = 10;
        let timeLeft = durationInSeconds;

        function changeImage() {
            currentIndex++;
            if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            sliderImage.src = images[currentIndex];
        }

     
        timer.textContent = `Traffic Light change in: ${timeLeft}`;
        setInterval(() => {
            timeLeft--;

            if (timeLeft === 0) {
                changeImage();
                timeLeft = durationInSeconds;
            }

            timer.textContent = `Traffic Light change in: ${timeLeft}`;
        }, 1000);
    </script>

</body>
</html>
